name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build app/Nexus.sln -c Release
      - name: Core tests
        run: dotnet run --project app/Nexus.Tests/Nexus.Tests.csproj -c Release --no-build -- app/TestResults/ci-core
      - name: Interface tests
        run: dotnet run --project app/Nexus.UiTests/Nexus.UiTests.csproj -c Release --no-build -- app/TestResults/ci-wizard
      # Builds and tests source only; no deployment payloads or release uploads.